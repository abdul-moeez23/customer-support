version: '3.8'

services:
  backend:
    restart: "no"
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MCP_SERVER_URL=${MCP_SERVER_URL}
      - MCP_SECRET_KEY=${MCP_SECRET_KEY}
      - WATCHFILES_FORCE_POLLING=true
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - QDRANT_URL=${QDRANT_URL}
    depends_on:
      - db
      - mcp
      - redis
      - minio
      - qdrant

  mcp:
    restart: "no"
    build:
      context: .
      dockerfile: mcp/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/aicustomer
      - MCP_SECRET_KEY=${MCP_SECRET_KEY:-dev-mcp-secret-change-in-production}
    depends_on:
      - db

  frontend:
    restart: "no"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  db:
    restart: "no"
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aicustomer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    restart: "no"
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - db

  redis:
    restart: "no"
    image: redis:alpine
    ports:
      - "6379:6379"

  minio:
    restart: "no"
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  celery_worker:
    restart: "no"
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A worker.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - QDRANT_URL=${QDRANT_URL}
    depends_on:
      - db
      - redis
      - minio
      - qdrant

  qdrant:
    restart: "no"
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
